<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: full-bleed WebGL desert, pixel HUD pinned to the corners, one centered message card.
     Single committed look: the game drives its own day/night palette, so colors are set here and by script. */
  :root {
    --sky: #e6ebee;
    --ink: #535353;
    --ink-soft: rgba(83, 83, 83, .55);
    --chip: rgba(255, 255, 255, .55);
    --pixel: "Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--sky); color: var(--ink); overflow: hidden; font-family: var(--pixel); user-select: none; -webkit-user-select: none; transition: background-color .4s; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

  .hud { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); font-size: clamp(11px, 2.4vw, 16px); letter-spacing: .08em; font-variant-numeric: tabular-nums; pointer-events: none; }
  #score { right: calc(18px + env(safe-area-inset-right, 0px)); display: flex; gap: 1.4em; }
  #hi { color: var(--ink-soft); }
  #score.flash #cur { animation: blink .2s steps(1) 4; }
  @keyframes blink { 50% { opacity: 0; } }

  #tools { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); display: flex; gap: 8px; }
  .chip { font: inherit; font-size: 10px; line-height: 1; letter-spacing: .08em; color: var(--ink); background: var(--chip); border: 2px solid var(--ink); padding: 7px 9px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .chip svg { width: 12px; height: 12px; fill: currentColor; }
  a.chip:hover { background: var(--ink); color: var(--sky); }
  .chip:focus-visible, .pad:focus-visible, #retry:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  #motion { position: fixed; top: calc(46px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); width: min(180px, 34vw); display: grid; gap: 6px; padding: 6px; background: var(--chip); border: 2px solid var(--ink); }
  #camView { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: #000; overflow: hidden; cursor: pointer; transform: scaleX(-1); }
  #camView video, #camView canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #camStatus { margin: 0; font-size: 10px; letter-spacing: .1em; }
  .cam-note { margin: 0; font-size: 7px; letter-spacing: .08em; line-height: 1.7; color: var(--ink-soft); }
  @media (max-width: 640px) { #score { top: calc(48px + env(safe-area-inset-top, 0px)); } }

  #msg { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; display: grid; gap: 18px; justify-items: center; pointer-events: none; width: min(92vw, 560px); }
  #msg h1 { margin: 0; font-size: clamp(18px, 5vw, 34px); font-weight: 400; letter-spacing: .25em; text-wrap: balance; }
  #msg p { margin: 0; font-size: clamp(9px, 2.2vw, 12px); letter-spacing: .12em; line-height: 1.9; color: var(--ink-soft); }
  #msg p.go { color: var(--ink); animation: pulse 1.2s steps(2) infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #retry { pointer-events: auto; width: 64px; height: 56px; border: 0; background: var(--ink); color: var(--sky); cursor: pointer; display: grid; place-items: center; }
  #retry svg { width: 34px; height: 34px; }

  #keys { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 9px; letter-spacing: .14em; color: var(--ink-soft); white-space: nowrap; pointer-events: none; }

  #pads { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: none; justify-content: space-between; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
  .pad { pointer-events: auto; touch-action: none; width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--ink); background: var(--chip); color: var(--ink); font: inherit; font-size: 10px; letter-spacing: .1em; display: grid; place-items: center; }
  .pad.on { background: var(--ink); color: var(--sky); }
  @media (pointer: coarse) { #pads { display: flex; } #keys { display: none; } }
  @media (prefers-reduced-motion: reduce) { #msg p.go, #score.flash #cur { animation: none; } }
</style>
</head>
<body>

<canvas id="stage" tabindex="0" aria-label="3D dinosaur runner game. Space or up arrow to jump, down arrow to duck."></canvas>

<div id="score" class="hud" aria-live="off"><span id="hi">HI 00000</span><span id="cur">00000</span></div>
<div id="tools">
  <button id="sound" class="chip" type="button" aria-pressed="true">SOUND ON</button>
  <button id="camera" class="chip" type="button" aria-pressed="false" title="Control the dino by jumping and ducking in front of your webcam">CAMERA</button>
  <a id="github" class="chip" href="https://github.com/romainavalle/dino-3d/" target="_blank" rel="noopener" aria-label="Source code on GitHub (opens in a new tab)">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.34.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.66 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
    GITHUB
  </a>
</div>

<div id="motion" hidden>
  <div id="camView" title="Click to recalibrate"><video id="camVideo" playsinline muted></video><canvas id="camOverlay"></canvas></div>
  <p id="camStatus" aria-live="polite">LOADING...</p>
  <p class="cam-note">JUMP TO JUMP &middot; SQUAT TO DUCK<br>CLICK VIDEO TO RECALIBRATE<br>VIDEO STAYS ON YOUR DEVICE</p>
</div>

<div id="msg">
  <h1 id="msgTitle">DINO RUN 3D</h1>
  <button id="retry" type="button" aria-label="Play again" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg>
  </button>
  <p class="go" id="msgHint">PRESS SPACE TO START</p>
  <p id="msgSub">JUMP THE CACTI &middot; DUCK THE PTERODACTYLS</p>
</div>

<div id="keys">SPACE / &uarr; JUMP &nbsp;&middot;&nbsp; &darr; DUCK</div>
<div id="pads">
  <button class="pad" id="padDuck" type="button">DUCK</button>
  <button class="pad" id="padJump" type="button">JUMP</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- palette: [day, night] ----------
  const PAL = {
    sky:    [0xe6ebee, 0x10131c],
    ground: [0xd8c7a2, 0x24262f],
    dino:   [0x535353, 0xdadada],
    cactus: [0x56604d, 0xa7b29d],
    ptero:  [0x5a5450, 0xcfc9c4],
    rock:   [0xc9b896, 0x3a3c47],
    mesa:   [0xd8c29c, 0x22242e],
    pebble: [0xa0937a, 0x4d4f5a],
    cloud:  [0xffffff, 0x353a4c],
  };
  const isCoarse = matchMedia('(pointer: coarse)').matches;

  // ---------- three setup ----------
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const skyColor = new THREE.Color(PAL.sky[0]);
  scene.background = skyColor;
  scene.fog = new THREE.Fog(skyColor, 35, 135);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
  const camBase = new THREE.Vector3(5.2, 3.4, 8.5);
  const camLook = new THREE.Vector3(0, 1.3, -7);

  const hemi = new THREE.HemisphereLight(0xffffff, 0xd9c9a8, 0.75);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(7, 15, 6);
  sun.target.position.set(0, 0, -5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 26, bottom: -26, near: 1, far: 70 });
  scene.add(sun, sun.target);

  const M = {};
  for (const k in PAL) {
    M[k] = new THREE.MeshLambertMaterial({ color: PAL[k][0] });
    M[k].userData = { day: new THREE.Color(PAL[k][0]), night: new THREE.Color(PAL[k][1]) };
  }
  M.eye = new THREE.MeshBasicMaterial({ color: 0xffffff });
  M.pupil = new THREE.MeshBasicMaterial({ color: 0x1d1d1d });

  const geoCache = new Map();
  const r2 = v => Math.round(v * 20) / 20;
  function geo(w, h, d) {
    const k = r2(w) + '|' + r2(h) + '|' + r2(d);
    let g = geoCache.get(k);
    if (!g) { g = new THREE.BoxGeometry(r2(w), r2(h), r2(d)); geoCache.set(k, g); }
    return g;
  }
  function box(parent, w, h, d, x, y, z, mat, cast = true) {
    const m = new THREE.Mesh(geo(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = cast;
    parent.add(m);
    return m;
  }

  // ---------- ground ----------
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), M.ground);
  ground.rotation.x = -Math.PI / 2;
  ground.position.z = -150;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- the dino (faces -z) ----------
  function makeLeg(parent, x, y, z, short) {
    const g = new THREE.Group();
    g.position.set(x, y, z);
    parent.add(g);
    if (short) box(g, 0.22, 0.38, 0.22, 0, -0.19, 0, M.dino);
    else { box(g, 0.3, 0.45, 0.42, 0, -0.15, 0, M.dino); box(g, 0.22, 0.4, 0.22, 0, -0.5, 0.02, M.dino); }
    box(g, 0.26, 0.12, 0.46, 0, short ? -0.44 : -0.74, -0.1, M.dino);
    return g;
  }
  function makeEye(parent, y, z) {
    const e = new THREE.Group();
    e.position.set(0, y, z);
    box(e, 0.77, 0.18, 0.18, 0, 0, 0, M.eye, false);
    box(e, 0.79, 0.09, 0.09, 0, 0, -0.03, M.pupil, false);
    parent.add(e);
    return e;
  }
  const dino = new THREE.Group();
  scene.add(dino);

  const stand = new THREE.Group();
  dino.add(stand);
  box(stand, 0.9, 1.0, 1.1, 0, 1.25, 0.05, M.dino);
  box(stand, 0.7, 0.7, 0.5, 0, 1.85, -0.35, M.dino);
  box(stand, 0.75, 0.6, 1.05, 0, 2.2, -0.72, M.dino);
  box(stand, 0.75, 0.22, 0.6, 0, 1.86, -0.95, M.dino);
  const eyeStand = makeEye(stand, 2.3, -0.6);
  box(stand, 0.6, 0.55, 0.6, 0, 1.35, 0.85, M.dino);
  box(stand, 0.42, 0.36, 0.5, 0, 1.55, 1.3, M.dino);
  box(stand, 0.26, 0.22, 0.38, 0, 1.75, 1.66, M.dino);
  for (const s of [-1, 1]) {
    box(stand, 0.12, 0.14, 0.36, s * 0.42, 1.45, -0.55, M.dino);
    box(stand, 0.12, 0.2, 0.12, s * 0.42, 1.33, -0.7, M.dino);
  }
  const standLegs = [makeLeg(stand, -0.25, 0.8, 0.15), makeLeg(stand, 0.25, 0.8, 0.15)];

  const duck = new THREE.Group();
  duck.visible = false;
  dino.add(duck);
  box(duck, 0.9, 0.75, 1.7, 0, 0.88, 0.2, M.dino);
  box(duck, 0.75, 0.6, 1.05, 0, 0.98, -1.0, M.dino);
  const eyeDuck = makeEye(duck, 1.08, -0.92);
  box(duck, 0.5, 0.4, 0.7, 0, 0.95, 1.35, M.dino);
  box(duck, 0.3, 0.26, 0.4, 0, 1.0, 1.85, M.dino);
  for (const s of [-1, 1]) box(duck, 0.12, 0.14, 0.32, s * 0.42, 0.7, -0.5, M.dino);
  const duckLegs = [makeLeg(duck, -0.25, 0.5, 0.45, true), makeLeg(duck, 0.25, 0.5, 0.45, true)];

  // shrunk hitboxes relative to dino position
  const HB_STAND = { y0: 0.12, y1: 2.35, z0: -1.0, z1: 0.6 };
  const HB_DUCK  = { y0: 0.12, y1: 1.2,  z0: -1.35, z1: 0.8 };

  // ---------- obstacles ----------
  const obstacles = [];
  const SPAWN_Z = -150;

  function makeCacti() {
    const g = new THREE.Group();
    const large = score > 150 && Math.random() < 0.45;
    const n = large ? 1 + Math.floor(Math.random() * 2) : 1 + Math.floor(Math.random() * 3);
    const w = large ? 0.5 : 0.4;
    let z = 0, maxH = 0;
    for (let i = 0; i < n; i++) {
      const h = large ? 1.55 + Math.random() * 0.3 : 0.95 + Math.random() * 0.35;
      const c = new THREE.Group();
      c.position.z = z;
      c.rotation.y = (Math.random() - 0.5) * 0.5;
      g.add(c);
      box(c, w, h, w, 0, h / 2, 0, M.cactus);
      box(c, w * 0.75, 0.1, w * 0.75, 0, h + 0.05, 0, M.cactus);
      const armL = h * (0.4 + Math.random() * 0.15);
      box(c, 0.32, 0.16, 0.18, -(w / 2 + 0.14), armL, 0, M.cactus);
      box(c, 0.18, 0.4, 0.18, -(w / 2 + 0.24), armL + 0.28, 0, M.cactus);
      if (Math.random() < 0.75) {
        const armR = h * (0.5 + Math.random() * 0.15);
        box(c, 0.32, 0.16, 0.18, w / 2 + 0.14, armR, 0, M.cactus);
        box(c, 0.18, 0.34, 0.18, w / 2 + 0.24, armR + 0.25, 0, M.cactus);
      }
      maxH = Math.max(maxH, h + 0.1);
      if (i < n - 1) z -= w + 0.15;
    }
    return { group: g, hb: { y0: 0, y1: maxH - 0.08, z0: z - w / 2 + 0.08, z1: w / 2 - 0.08 }, extra: 0 };
  }

  function makePtero() {
    const g = new THREE.Group();
    // low: jump it · mid: duck it · high: run under it
    const level = [0.75, 1.85, 3.0][Math.floor(Math.random() * 3)];
    const body = new THREE.Group();
    body.position.y = level;
    g.add(body);
    box(body, 0.42, 0.32, 1.0, 0, 0, 0, M.ptero);
    box(body, 0.36, 0.32, 0.45, 0, 0.1, 0.62, M.ptero);
    box(body, 0.14, 0.1, 0.55, 0, 0.04, 1.06, M.ptero);
    box(body, 0.1, 0.2, 0.5, 0, 0.26, 0.3, M.ptero);
    box(body, 0.2, 0.14, 0.5, 0, 0.02, -0.7, M.ptero);
    const eye = box(body, 0.38, 0.08, 0.08, 0, 0.16, 0.72, M.eye, false);
    eye.castShadow = false;
    const wings = [];
    for (const s of [-1, 1]) {
      const pivot = new THREE.Group();
      pivot.position.set(s * 0.2, 0.08, 0.05);
      body.add(pivot);
      box(pivot, 0.8, 0.07, 0.65, s * 0.4, 0, 0, M.ptero);
      box(pivot, 0.7, 0.06, 0.4, s * 1.1, 0, -0.1, M.ptero);
      wings.push({ pivot, s });
    }
    return { group: g, hb: { y0: level - 0.3, y1: level + 0.3, z0: -0.4, z1: 1.1 }, extra: 3, wings, phase: Math.random() * 6 };
  }

  function spawnObstacle(z = SPAWN_Z) {
    const o = score > 300 && Math.random() < 0.3 ? makePtero() : makeCacti();
    o.group.position.z = z;
    scene.add(o.group);
    obstacles.push(o);
  }

  function clearObstacles() {
    for (const o of obstacles) scene.remove(o.group);
    obstacles.length = 0;
  }

  // ---------- scenery (recycled ring) ----------
  const scenery = [];
  const RING_NEAR = 25, RING_LEN = 190;
  const rand = (a, b) => a + Math.random() * (b - a);
  const side = () => (Math.random() < 0.5 ? -1 : 1);

  function addScenery(obj, x, z, speedMul = 1) {
    obj.position.set(x, obj.position.y, z);
    scene.add(obj);
    scenery.push({ obj, speedMul });
  }
  for (let i = 0; i < 90; i++) { // pebbles on the track
    const g = new THREE.Group();
    const s = rand(0.06, 0.2);
    box(g, s * rand(1, 2), s * 0.6, s, 0, s * 0.3, 0, M.pebble, false);
    addScenery(g, rand(-4, 4), rand(-RING_LEN + RING_NEAR, RING_NEAR));
  }
  for (let i = 0; i < 55; i++) { // rocks and dry scrub beside the track
    const g = new THREE.Group();
    if (Math.random() < 0.6) {
      const w = rand(0.6, 2.4), h = rand(0.3, 1.2);
      box(g, w, h, w * rand(0.6, 1.1), 0, h / 2, 0, M.rock);
      if (Math.random() < 0.5) box(g, w * 0.6, h * 0.6, w * 0.5, w * 0.4, h * 0.3, w * 0.2, M.rock);
      g.rotation.y = rand(0, Math.PI);
    } else {
      const h = rand(0.8, 1.6);
      box(g, 0.3, h, 0.3, 0, h / 2, 0, M.cactus);
      box(g, 0.3, 0.14, 0.14, 0.25, h * 0.55, 0, M.cactus);
      box(g, 0.14, 0.35, 0.14, 0.34, h * 0.55 + 0.22, 0, M.cactus);
    }
    addScenery(g, side() * rand(5, 30), rand(-RING_LEN + RING_NEAR, RING_NEAR));
  }
  for (let i = 0; i < 16; i++) { // far mesas
    const g = new THREE.Group();
    const w = rand(10, 24), h = rand(5, 13), d = rand(8, 16);
    box(g, w, h, d, 0, h / 2, 0, M.mesa, false);
    box(g, w * 0.7, h * 0.35, d * 0.8, w * 0.1, h + h * 0.17, 0, M.mesa, false);
    addScenery(g, side() * rand(40, 75), rand(-RING_LEN + RING_NEAR, RING_NEAR), 0.6);
  }
  for (let i = 0; i < 14; i++) { // voxel clouds
    const g = new THREE.Group();
    g.position.y = rand(11, 18);
    const n = 3 + Math.floor(Math.random() * 3);
    for (let j = 0; j < n; j++) box(g, rand(2, 4), rand(0.8, 1.4), rand(1.5, 2.5), j * 1.6 - n * 0.8, rand(-0.3, 0.4), rand(-0.5, 0.5), M.cloud, false);
    addScenery(g, rand(-45, 45), rand(-RING_LEN + RING_NEAR, RING_NEAR), 0.12);
  }

  // night sky
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i = 0; i < 500; i++) {
    const th = rand(0, Math.PI * 2), ph = rand(0.08, 1.2), R = 220;
    starPos.push(R * Math.cos(ph) * Math.cos(th), R * Math.sin(ph), R * Math.cos(ph) * Math.sin(th) - 60);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
  scene.add(new THREE.Points(starGeo, starMat));
  const moonMat = new THREE.MeshBasicMaterial({ color: 0xf2f0e6, transparent: true, opacity: 0, fog: false });
  const moon = new THREE.Mesh(new THREE.BoxGeometry(9, 9, 9), moonMat);
  moon.position.set(-60, 70, -220);
  moon.rotation.set(0.4, 0.6, 0.2);
  scene.add(moon);

  // ---------- HUD + sound ----------
  const $ = id => document.getElementById(id);
  const elCur = $('cur'), elHi = $('hi'), elScore = $('score');
  const msg = $('msg'), msgTitle = $('msgTitle'), msgHint = $('msgHint'), msgSub = $('msgSub'), retry = $('retry');
  const pad5 = n => String(Math.floor(n)).padStart(5, '0');
  const tapWord = isCoarse ? 'TAP' : 'PRESS SPACE';
  msgHint.textContent = tapWord + ' TO START';

  let hi = 0;
  try { hi = +localStorage.getItem('dino3d-hi') || 0; } catch (e) {}
  elHi.textContent = 'HI ' + pad5(hi);

  let soundOn = true, actx = null;
  try { soundOn = localStorage.getItem('dino3d-sound') !== 'off'; } catch (e) {}
  const soundBtn = $('sound');
  function paintSound() { soundBtn.textContent = soundOn ? 'SOUND ON' : 'SOUND OFF'; soundBtn.setAttribute('aria-pressed', String(soundOn)); }
  paintSound();
  soundBtn.addEventListener('click', e => {
    e.stopPropagation();
    soundOn = !soundOn;
    paintSound();
    try { localStorage.setItem('dino3d-sound', soundOn ? 'on' : 'off'); } catch (err) {}
    soundBtn.blur();
    canvas.focus();
  });
  function beep(freq, dur, slide = 0, vol = 0.045) {
    if (!soundOn) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  // ---------- game state ----------
  const G = 38, JUMP_V = 13, BASE_SPEED = 18, MAX_SPEED = 46;
  let state = 'ready';
  let y = 0, vy = 0, onGround = true, ducking = false;
  let jumpBuffer = 0, duckHeld = false;
  let speed = BASE_SPEED, distance = 0, score = 0, shownScore = -1;
  let sinceSpawn = 0, nextGap = 0;
  let runPhase = 0, overAt = 0, shake = 0, blinkT = 2;
  let nightT = 0;

  function showMsg(title, hint, sub, withRetry) {
    msgTitle.textContent = title;
    msgHint.textContent = hint;
    msgSub.textContent = sub;
    retry.hidden = !withRetry;
    msg.hidden = false;
  }

  // Google Analytics events; never let tracking break the game
  function track(name, params) {
    try { if (typeof window.gtag === 'function') window.gtag('event', name, params); } catch (e) {}
  }

  function start() {
    track('game_start', { previous_high_score: hi });
    clearObstacles();
    y = 0; vy = 0; onGround = true;
    speed = BASE_SPEED; distance = 0; score = 0; shownScore = -1;
    sinceSpawn = 0; nextGap = 26;
    eyeStand.scale.set(1, 1, 1); eyeDuck.scale.set(1, 1, 1);
    spawnObstacle(-75);
    state = 'running';
    msg.hidden = true;
  }

  function die() {
    state = 'over';
    overAt = performance.now();
    shake = 0.35;
    eyeStand.scale.set(1, 1.9, 1.9);
    eyeDuck.scale.set(1, 1.9, 1.9);
    beep(220, 0.12); setTimeout(() => beep(150, 0.22, -60), 110);
    track('game_over', { score: Math.floor(score), new_high_score: score > hi, night: nightT > 0.5 });
    if (score > hi) {
      hi = Math.floor(score);
      elHi.textContent = 'HI ' + pad5(hi);
      try { localStorage.setItem('dino3d-hi', String(hi)); } catch (e) {}
    }
    showMsg('G A M E  O V E R', hintWord() + ' TO RETRY', 'SCORE ' + pad5(score), true);
  }

  function pressJump() {
    if (state === 'ready') { start(); jumpBuffer = 0.12; return; }
    if (state === 'over') { if (performance.now() - overAt > 450) start(); return; }
    jumpBuffer = 0.12;
  }

  // ---------- input ----------
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (!e.repeat) pressJump();
    } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      e.preventDefault();
      duckHeld = true;
    } else if (e.code === 'Enter' && state === 'over') {
      pressJump();
    }
  });
  addEventListener('keyup', e => {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') duckHeld = false;
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); canvas.focus(); pressJump(); });
  retry.addEventListener('click', e => { e.stopPropagation(); start(); canvas.focus(); });

  const padJump = $('padJump'), padDuck = $('padDuck');
  padJump.addEventListener('pointerdown', e => { e.preventDefault(); padJump.classList.add('on'); pressJump(); });
  const duckOn = e => { e.preventDefault(); duckHeld = true; padDuck.classList.add('on'); if (state !== 'running') pressJump(); };
  const duckOff = () => { duckHeld = false; padDuck.classList.remove('on'); };
  padDuck.addEventListener('pointerdown', duckOn);
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
    padDuck.addEventListener(ev, duckOff);
    padJump.addEventListener(ev, () => padJump.classList.remove('on'));
  }
  addEventListener('blur', duckOff);

  // ---------- body controls (MediaPipe pose, runs locally in the browser) ----------
  const MP_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  // movement thresholds, in shoulder widths from the calibrated standing height
  const JUMP_UP = 0.22, JUMP_REARM = 0.08, DUCK_DOWN = 0.4, DUCK_RELEASE = 0.22;
  const CALIB_FRAMES = 20;

  const camBtn = $('camera'), motionEl = $('motion'), camView = $('camView'), camVideo = $('camVideo'), camOverlay = $('camOverlay'), camStatus = $('camStatus');
  const octx = camOverlay.getContext('2d');
  let motionOn = false, motionPending = false, motionDuck = false;
  let landmarker = null, camStream = null, motionRaf = 0;
  let lastVideoTime = -1, baseY = 0, baseW = 0, calib = [], jumpArmed = true, lostSince = 0;

  function hintWord() { return motionOn ? 'JUMP' : tapWord; }
  function refreshHint() {
    if (state === 'ready') msgHint.textContent = hintWord() + ' TO START';
    else if (state === 'over') msgHint.textContent = hintWord() + ' TO RETRY';
  }
  function setStatus(text) { if (camStatus.textContent !== text) camStatus.textContent = text; }
  function paintCamBtn() {
    camBtn.textContent = motionOn ? 'CAMERA ON' : 'CAMERA';
    camBtn.setAttribute('aria-pressed', String(motionOn));
  }

  async function startMotion() {
    motionPending = true;
    motionEl.hidden = false;
    setStatus('LOADING...');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('CAMERA NEEDS HTTPS');
      motionPending = false;
      return;
    }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    } catch (e) {
      setStatus(e && e.name === 'NotAllowedError' ? 'CAMERA BLOCKED' : 'NO CAMERA FOUND');
      motionPending = false;
      return;
    }
    camVideo.srcObject = camStream;
    try { await camVideo.play(); } catch (e) {}
    try {
      if (!landmarker) {
        const { FilesetResolver, PoseLandmarker } = await import(MP_URL + '/vision_bundle.mjs');
        const fileset = await FilesetResolver.forVisionTasks(MP_URL + '/wasm');
        const opts = delegate => ({ baseOptions: { modelAssetPath: POSE_MODEL, delegate }, runningMode: 'VIDEO', numPoses: 1 });
        try { landmarker = await PoseLandmarker.createFromOptions(fileset, opts('GPU')); }
        catch (e) { landmarker = await PoseLandmarker.createFromOptions(fileset, opts('CPU')); }
      }
    } catch (e) {
      stopMotion(true);
      setStatus('TRACKER FAILED TO LOAD');
      return;
    }
    motionPending = false;
    if (!camStream) return; // switched off while loading
    motionOn = true;
    paintCamBtn();
    refreshHint();
    recalibrate();
    track('camera_enabled');
    motionRaf = requestAnimationFrame(motionLoop);
  }

  function stopMotion(keepPanel) {
    cancelAnimationFrame(motionRaf);
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    camVideo.srcObject = null;
    motionOn = motionPending = motionDuck = false;
    paintCamBtn();
    refreshHint();
    if (!keepPanel) motionEl.hidden = true;
  }

  function recalibrate() {
    calib = [];
    jumpArmed = true;
    motionDuck = false;
    lostSince = 0;
    setStatus('STAND STILL');
  }

  function drawOverlay(lm, w, h) {
    octx.clearRect(0, 0, w, h);
    const line = (yn, color) => { octx.strokeStyle = color; octx.beginPath(); octx.moveTo(0, yn * h); octx.lineTo(w, yn * h); octx.stroke(); };
    octx.lineWidth = 3;
    if (calib.length >= CALIB_FRAMES) {
      octx.setLineDash([10, 8]);
      line(baseY - JUMP_UP * baseW, '#7fd1ff');
      line(baseY + DUCK_DOWN * baseW, '#ffb347');
      octx.setLineDash([]);
      line(baseY, 'rgba(255,255,255,.45)');
    }
    if (!lm) return;
    octx.strokeStyle = '#fff';
    octx.lineWidth = 4;
    octx.beginPath();
    octx.moveTo(lm[11].x * w, lm[11].y * h);
    octx.lineTo(lm[12].x * w, lm[12].y * h);
    octx.stroke();
    octx.fillStyle = '#fff';
    for (const i of [0, 11, 12]) octx.fillRect(lm[i].x * w - 5, lm[i].y * h - 5, 10, 10);
  }

  function motionLoop() {
    motionRaf = requestAnimationFrame(motionLoop);
    if (!landmarker || camVideo.readyState < 2 || camVideo.currentTime === lastVideoTime) return;
    lastVideoTime = camVideo.currentTime;
    const w = camVideo.videoWidth, h = camVideo.videoHeight;
    if (camOverlay.width !== w || camOverlay.height !== h) { camOverlay.width = w; camOverlay.height = h; }

    let res;
    try { res = landmarker.detectForVideo(camVideo, performance.now()); } catch (e) { return; }
    const lm = res.landmarks && res.landmarks[0];
    const seen = lm && lm[11].visibility > 0.5 && lm[12].visibility > 0.5;
    if (!seen) {
      drawOverlay(null, w, h);
      if (!lostSince) lostSince = performance.now();
      if (performance.now() - lostSince > 400) { motionDuck = false; setStatus('STEP INTO VIEW'); }
      return;
    }
    lostSince = 0;

    // shoulder height and width, both in normalized image-height units
    const sy = (lm[11].y + lm[12].y) / 2;
    const sw = Math.hypot((lm[11].x - lm[12].x) * w / h, lm[11].y - lm[12].y);

    if (calib.length < CALIB_FRAMES) {
      calib.push([sy, sw]);
      setStatus('STAND STILL');
      if (calib.length === CALIB_FRAMES) {
        const ys = calib.map(c => c[0]);
        if (Math.max(...ys) - Math.min(...ys) > 0.04) calib = []; // moved too much, start over
        else {
          baseY = ys.reduce((a, b) => a + b, 0) / CALIB_FRAMES;
          baseW = calib.reduce((a, c) => a + c[1], 0) / CALIB_FRAMES;
          beep(660, 0.08);
        }
      }
      drawOverlay(lm, w, h);
      return;
    }

    const d = (baseY - sy) / baseW; // positive = body moved up, negative = moved down
    if (jumpArmed && d > JUMP_UP) { jumpArmed = false; pressJump(); }
    else if (!jumpArmed && d < JUMP_REARM) jumpArmed = true;
    if (!motionDuck && d < -DUCK_DOWN) motionDuck = true;
    else if (motionDuck && d > -DUCK_RELEASE) motionDuck = false;

    // follow slow drift (stepping closer, camera nudged) while standing normally
    if (Math.abs(d) < 0.1) { baseY += (sy - baseY) * 0.02; baseW += (sw - baseW) * 0.02; }

    setStatus(motionDuck ? 'DUCK' : !jumpArmed ? 'JUMP!' : 'READY');
    drawOverlay(lm, w, h);
  }

  camBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (motionOn || motionPending) stopMotion();
    else startMotion();
    camBtn.blur();
    canvas.focus();
  });
  camView.addEventListener('click', () => { if (motionOn) recalibrate(); });

  // ---------- resize ----------
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // pull the camera back on tall phones so the track still reads
    const portrait = w / h < 1;
    camera.fov = portrait ? 68 : 50;
    camBase.set(portrait ? 4.2 : 5.2, portrait ? 4.2 : 3.4, portrait ? 10.5 : 8.5);
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  // ---------- day / night ----------
  const tmp = new THREE.Color();
  const hemiDay = new THREE.Color(0xffffff), hemiNight = new THREE.Color(0x8794c4);
  const root = document.documentElement.style;
  function applyNight(t) {
    for (const k in PAL) M[k].color.copy(M[k].userData.day).lerp(M[k].userData.night, t);
    skyColor.copy(M.sky.color);
    scene.fog.color.copy(skyColor);
    hemi.intensity = 0.55 - 0.2 * t;
    hemi.color.copy(hemiDay).lerp(hemiNight, t);
    sun.intensity = 0.6 - 0.3 * t;
    starMat.opacity = t;
    moonMat.opacity = t;
    const ink = tmp.copy(M.dino.color);
    const r = Math.round(ink.r * 255), g = Math.round(ink.g * 255), b = Math.round(ink.b * 255);
    root.setProperty('--sky', '#' + skyColor.getHexString());
    root.setProperty('--ink', `rgb(${r},${g},${b})`);
    root.setProperty('--ink-soft', `rgba(${r},${g},${b},.55)`);
    root.setProperty('--chip', t > 0.5 ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.55)');
  }
  applyNight(0);

  // ---------- loop ----------
  const clock = new THREE.Clock();
  let lastNight = -1;

  function hit(o) {
    const hb = ducking ? HB_DUCK : HB_STAND;
    const oz = o.group.position.z;
    return y + hb.y1 > o.hb.y0 && y + hb.y0 < o.hb.y1 && hb.z1 > oz + o.hb.z0 && hb.z0 < oz + o.hb.z1;
  }

  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const running = state === 'running';

    if (running) {
      speed = Math.min(MAX_SPEED, BASE_SPEED + score * 0.012);
      distance += speed * dt;
      score = distance * 0.55;

      // jump / gravity
      jumpBuffer = Math.max(0, jumpBuffer - dt);
      if (jumpBuffer > 0 && onGround) {
        vy = JUMP_V; onGround = false; jumpBuffer = 0;
        beep(520, 0.09, 260);
      }
      if (!onGround) {
        vy -= G * (duckHeld || motionDuck ? 2.4 : 1) * dt;
        y += vy * dt;
        if (y <= 0) { y = 0; vy = 0; onGround = true; }
      }
      ducking = (duckHeld || motionDuck) && onGround;

      // obstacles
      sinceSpawn += speed * dt;
      if (sinceSpawn >= nextGap) {
        spawnObstacle();
        sinceSpawn = 0;
        nextGap = speed * (0.85 + Math.random() * 1.15) + 4;
      }
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.group.position.z += (speed + o.extra) * dt;
        if (o.group.position.z > 20) { scene.remove(o.group); obstacles.splice(i, 1); continue; }
        if (hit(o)) { die(); break; }
      }

      // score + milestone
      const s = Math.floor(score);
      if (s !== shownScore) {
        if (shownScore >= 0 && Math.floor(s / 100) > Math.floor(shownScore / 100)) {
          beep(880, 0.08); setTimeout(() => beep(1320, 0.12), 90);
          elScore.classList.remove('flash'); void elScore.offsetWidth; elScore.classList.add('flash');
        }
        shownScore = s;
        elCur.textContent = pad5(s);
      }
    }

    // scenery scroll
    const worldSpeed = running ? speed : 0;
    for (const s of scenery) {
      s.obj.position.z += (worldSpeed * s.speedMul + (s.speedMul < 0.2 ? 0.6 : 0)) * dt;
      if (s.obj.position.z > RING_NEAR) {
        s.obj.position.z -= RING_LEN;
        if (s.speedMul === 1 && Math.abs(s.obj.position.x) < 4.5) s.obj.position.x = rand(-4, 4);
      }
    }

    // pterodactyl wings
    const t = clock.elapsedTime;
    for (const o of obstacles) if (o.wings) {
      const f = Math.sin(t * 11 + o.phase);
      for (const w of o.wings) w.pivot.rotation.z = w.s * f * 0.65;
      o.group.children[0].position.y = o.hb.y0 + 0.3 + f * 0.06;
    }

    // dino pose
    stand.visible = !ducking;
    duck.visible = ducking;
    dino.position.y = y;
    if (running && onGround) {
      runPhase += dt * speed * 0.75;
      const a = Math.sin(runPhase) * 0.75;
      standLegs[0].rotation.x = a; standLegs[1].rotation.x = -a;
      duckLegs[0].rotation.x = a; duckLegs[1].rotation.x = -a;
      stand.position.y = Math.abs(Math.cos(runPhase)) * 0.07;
      duck.position.y = Math.abs(Math.cos(runPhase)) * 0.04;
    } else if (running) {
      standLegs[0].rotation.x = 0.35; standLegs[1].rotation.x = -0.2;
      stand.position.y = 0;
    } else if (state === 'ready') {
      standLegs[0].rotation.x = standLegs[1].rotation.x = 0;
      stand.position.y = Math.sin(t * 2) * 0.02;
      blinkT -= dt;
      eyeStand.scale.y = blinkT < 0.12 ? 0.15 : 1;
      if (blinkT < 0) blinkT = 2 + Math.random() * 2.5;
    }
    dino.rotation.x = running && !onGround ? -vy * 0.012 : 0;

    // day / night every 700 points
    const target = Math.floor(score / 700) % 2;
    nightT += (target - nightT) * Math.min(1, dt * 0.8);
    if (Math.abs(nightT - lastNight) > 0.002) { applyNight(nightT); lastNight = nightT; }

    // camera
    camera.position.copy(camBase);
    camera.position.y += y * 0.3;
    if (shake > 0) {
      shake -= dt;
      camera.position.x += (Math.random() - 0.5) * shake * 0.8;
      camera.position.y += (Math.random() - 0.5) * shake * 0.8;
    }
    camera.lookAt(camLook.x, camLook.y + y * 0.2, camLook.z);

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });
  canvas.focus();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
